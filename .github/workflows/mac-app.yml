name: mac-app

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KVM-Switch
          path: build/KVM-Switch.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/KVM-Switch.zip --title "$GITHUB_REF_NAME" --generate-notes
